[package]
name = "music_e2e_tests"
version = "0.1.0"
edition = "2021"

[workspace]


[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
regex = "1"
reqwest = { version = "0.12", features = ["json"] }

[[test]]
name = "e2e_tests"
path = "e2e_tests.rs"
